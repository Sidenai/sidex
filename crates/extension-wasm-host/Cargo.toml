[package]
name = "sidex-extension-wasm-host"
description = "wasmtime host for SideX's native WASM-component extensions"
keywords = ["extensions", "wasm", "wasmtime", "component-model", "sidex"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
walkdir = { workspace = true }
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
log = "0.4"
dirs = "5"
flate2 = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "blocking", "gzip"] }
wasmtime = { version = "50.0.1", default-features = false, features = [
  "runtime",
  "component-model",
  "cranelift",
  "async",
] }
wasmtime-wasi = "50.0.1"

[lints]
workspace = true
