[package]
name = "sidex-agent"
version = "0.2.0"
edition = "2021"
rust-version = "1.91.0"
license = "MIT"
repository = "https://github.com/sidenai/sidex"
description = "AI coding agent tool executor for Sidex"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
regex = "1"
walkdir = "2"
ignore = "0.4"
globset = "0.4"
memchr = "2"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
