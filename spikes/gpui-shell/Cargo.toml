# THROWAWAY SPIKE — not part of the product. Own workspace so it never touches
# the native build. See spikes/gpui-shell/README.md.
[package]
name = "sidex-gpui-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
gpui-kit = { version = "0.8.1", features = ["syntect"] }
sidex-workspace = { path = "../../crates/workspace" }
sidex-theme = { path = "../../crates/theme" }
sidex-settings = { path = "../../crates/settings" }
serde_json = "1"
dirs = "6"
# Same syntect + two-face gpui-kit uses, so grammars match its syntect backend.
syntect = { version = "5.3", default-features = false, features = [
  "parsing",
  "regex-fancy",
] }
two-face = { version = "0.4.5", default-features = false, features = [
  "syntect-fancy",
] }
anyhow = "1"
# Must match gpui-base, whose InputHighlighter trait takes this Rope.
ropey = "=2.0.0-beta.1"
log = "0.4"
env_logger = "0.11"
alacritty_terminal = "0.26"
futures = "0.3"
regex = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
