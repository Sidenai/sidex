# Demo native extension for the GPUI spike. Own workspace: it builds for
# wasm32-wasip2 (`cargo build --release --target wasm32-wasip2`).
[package]
name = "word-count-extension"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
sidex-extension-sdk = { path = "../../../../crates/extension-sdk" }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
