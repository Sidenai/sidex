name: Lint JS/TS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/lint-js.yml"
      - "src/**"
      - "tsconfig.json"
      - "eslint.config.*"
      - "package.json"
      - "bun.lock"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lint-js.yml"
      - "src/**"
      - "tsconfig.json"
      - "eslint.config.*"
      - "package.json"
      - "bun.lock"

concurrency:
  group: lint-js-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun tsc --noEmit

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint
